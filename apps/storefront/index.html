<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="PequeModas-Juguetería — Tienda infantil de juguetes, ropa y accesorios para niños en CUP o USD. Compra directo en la App con chat en vivo o por WhatsApp."
    />
    <meta name="theme-color" content="#D4385B" />

    <!-- Instalación en iPhone / iPad: Safari usa estas etiquetas, no beforeinstallprompt -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PequeModas" />
    <link rel="canonical" href="https://pequemodas.vercel.app/" />

    <!-- Aceleración de Red y Carga Crítica (LCP) para ambos servidores Supabase -->
    <link rel="preconnect" href="https://vcohlillbvznsovswdng.supabase.co" crossorigin />
    <link rel="preconnect" href="https://ikwekjyeoqxwyyandyrr.supabase.co" crossorigin />
    <link rel="preload" as="image" href="/brand/logo-foreground.webp" type="image/webp" />

    <!-- Iconos Oficiales de Aplicación, Navegador, Vercel y PWA -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Vista Previa Rica para WhatsApp, Telegram y Redes -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PequeModas-Juguetería" />
    <meta property="og:locale" content="es_CU" />
    <meta
      property="og:title"
      content="PequeModas-Juguetería — Ropa Infantil, Juguetes y Accesorios"
    />
    <meta
      property="og:description"
      content="Descubre ropa infantil, calzado y juguetes en CUP. Compra directo desde nuestra aplicación con chat en vivo o por WhatsApp."
    />
    <meta property="og:url" content="https://pequemodas.vercel.app/" />
    <meta
      property="og:image"
      content="https://pequemodas.vercel.app/og-pequemodas-v3.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://pequemodas.vercel.app/og-pequemodas-v3.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo oficial de PequeModas-Juguetería con arcoíris, osito y nubes"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PequeModas-Juguetería — Ropa Infantil y Juguetes"
    />
    <meta
      name="twitter:description"
      content="Catálogo infantil actualizado en CUP con compra directa y chat en vivo."
    />
    <meta
      name="twitter:image"
      content="https://pequemodas.vercel.app/og-pequemodas-v3.jpg"
    />

    <title>PequeModas-Juguetería — Ropa Infantil y Juguetes</title>
  </head>
  <body class="bg-cream text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
